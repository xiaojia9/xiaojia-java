server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: tlias-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:testdemo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    # 如需修改数据库账号密码，直接改这里（也可用环境变量 MYSQL_USERNAME / MYSQL_PASSWORD 覆盖）
    url: jdbc:mysql://localhost:3306/testdemo
#    username: ${MYSQL_USERNAME:root}
    username: root
#    password: ${MYSQL_PASSWORD:1234}
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  mvc:
    # 找不到处理器时抛出 NoHandlerFoundException，交给全局异常处理器返回统一 JSON
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # 关闭默认静态资源映射，本项目只保留 WebConfig 中注册的 /files/** 图片映射
      add-mappings: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
    # 控制台打印 SQL，便于调试；生产环境可改为 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# ============================================================
# 自定义配置
# ============================================================
tlias:
  jwt:
    # JWT 签名密钥（长度必须 >= 32 位，生产环境请务必修改）
    secret: tlias-smart-learning-system-jwt-secret-key-2024
    # 令牌有效期（毫秒），默认 24 小时
    expire: 86400000

  upload:
    # 本地存储目录（仅在 OSS 未启用时生效），可通过 /files/** 访问
    dir: ./upload

  # ----------------------------------------------------------
  # 阿里云 OSS 配置（上传图片功能）
  # 只需要修改这里的配置即可切换到自己的 OSS，无需改动代码
  # ----------------------------------------------------------
  oss:
    # 是否启用 OSS：true 使用阿里云 OSS；false 使用本地磁盘上传目录
    enabled: true
    endpoint: https://oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    # Bucket 名称
    bucket-name: 
    # 上传目录前缀，例如 tlias/
    dir: tlias/
    # 访问域名（可选）：例如 https://your-bucket.oss-cn-hangzhou.aliyuncs.com
    # 留空时会自动使用 https://{bucket-name}.{endpoint}/{objectName} 拼接
    domain: ''

logging:
  level:
    root: info
    com.tlias: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
